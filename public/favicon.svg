<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5ead8" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#ee1b2e" />
    </linearGradient>

    <!-- Drop Shadow for Heart -->
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#2a1805" flood-opacity="0.2" />
    </filter>

    <!-- Clip Path matching the rounded squircle boundary -->
    <clipPath id="squircleClip">
      <rect x="2" y="2" width="60" height="60" rx="16" />
    </clipPath>
  </defs>

  <style>
    .bg-card { fill: url(#bgGrad); }
    .border-stroke { stroke: #3a2e24; }
    @media (prefers-color-scheme: dark) {
      .bg-card { fill: #24201c; }
      .border-stroke { stroke: #54463a; }
    }
  </style>

  <!-- Background Base -->
  <rect class="bg-card" x="2" y="2" width="60" height="60" rx="16" />

  <!-- ALL CONTENT CLIPPED INSIDE SQUIRCLE -->
  <g clip-path="url(#squircleClip)">
    <!-- Soft ground shadow in background -->
    <ellipse cx="32" cy="62" rx="28" ry="8" fill="#e8dac8" opacity="0.6" />

    <!-- ================= 1. GIRAFFE (#B - Right Side) ================= -->
    <g class="giraffe">
      <!-- Mane along back of neck -->
      <path d="M 50 40 L 53 43 L 51 46 L 54 49 L 52 53 L 55 56 L 53 60 L 55 64 L 47 64 Z" fill="#78350f" stroke="#261c14" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Neck -->
      <path d="M 38 64 L 40 42 C 41 38 45 36 49 38 L 52 42 L 54 64 Z" fill="#fbbf24" stroke="#261c14" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Spots on neck -->
      <circle cx="45.5" cy="45" r="3" fill="#d97706" />
      <ellipse cx="44" cy="53" rx="2.8" ry="3.5" fill="#d97706" />
      <circle cx="48.5" cy="60" r="3.2" fill="#d97706" />

      <!-- Horns (Ossicones) - Cleanly below the heart -->
      <g>
        <rect x="42.5" y="24" width="2.2" height="6" rx="1" fill="#fbbf24" stroke="#261c14" stroke-width="1.2" />
        <circle cx="43.6" cy="24" r="2.2" fill="#78350f" stroke="#261c14" stroke-width="1.2" />
        <rect x="47" y="25" width="2.2" height="6" rx="1" fill="#fbbf24" stroke="#261c14" stroke-width="1.2" transform="rotate(18 48 28)" />
        <circle cx="49.8" cy="25" r="2.2" fill="#78350f" stroke="#261c14" stroke-width="1.2" />
      </g>

      <!-- Giraffe Ear -->
      <path d="M 49 33 C 55 31 57 34 54 37 C 51 38 49 36 49 33 Z" fill="#fbbf24" stroke="#261c14" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 50 33.5 C 53 32 55 33.5 53 35 Z" fill="#f59e0b" />

      <!-- Giraffe Head -->
      <path
        d="M 44 28 C 49 28 52 31.5 52 36 C 52 41 48 43 43 43 C 38 43 33 40.5 33 37 C 33 32.5 38 28 44 28 Z"
        fill="#fbbf24"
        stroke="#261c14"
        stroke-width="1.5"
        stroke-linejoin="round"
      />

      <!-- Snout Patch -->
      <path
        d="M 40 33 C 35 33 33 35 33 37 C 33 39.5 35.5 42 40 42 Z"
        fill="#fef08a"
      />
      <!-- Nostril -->
      <circle cx="35" cy="36.5" r="1" fill="#78350f" />
      <!-- Gentle Smile -->
      <path d="M 35 39 C 36.8 40 38.5 39.5 39.5 38.8" stroke="#78350f" stroke-width="1" stroke-linecap="round" fill="none" />

      <!-- Big Shiny Eye -->
      <ellipse cx="43" cy="33.5" rx="2.2" ry="2.6" fill="#1e1810" />
      <circle cx="43.7" cy="32.8" r="0.9" fill="#ffffff" />
      <circle cx="42.3" cy="34.5" r="0.45" fill="#ffffff" />

      <!-- Pink Blush -->
      <ellipse cx="41" cy="38.5" rx="2.4" ry="1.5" fill="#fb7185" opacity="0.85" />
    </g>

    <!-- ================= 2. ELEPHANT (#A - Left Side) ================= -->
    <g class="elephant">
      <!-- Big Ear behind head -->
      <ellipse cx="12" cy="43" rx="8" ry="11" fill="#587287" stroke="#261c14" stroke-width="1.5" />
      <ellipse cx="12.5" cy="43" rx="5" ry="7.5" fill="#7893a7" />

      <!-- Torso / Shoulder -->
      <path d="M 4 64 C 4 48 11 40 21 40 C 27 40 32 44 34 50 L 34 64 Z" fill="#6f8ca3" stroke="#261c14" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Elephant Head -->
      <circle cx="22" cy="39" r="10" fill="#6f8ca3" stroke="#261c14" stroke-width="1.5" />

      <!-- Little White Tusk -->
      <path d="M 26.5 45 C 29.5 46 31 44.5 30 42 C 28 43 26.5 43.5 26.5 45 Z" fill="#ffffff" stroke="#261c14" stroke-width="1.2" stroke-linejoin="round" />

      <!-- Elephant Trunk -->
      <path
        d="M 26 42 C 28 46 31.5 49 34 47 C 35.5 45 34 40.5 30.5 39 C 31.5 41.5 31 43.5 29.5 44 C 28.5 44.5 27 43 26 42 Z"
        fill="#6f8ca3"
        stroke="#261c14"
        stroke-width="1.5"
        stroke-linejoin="round"
      />

      <!-- Big Shiny Eye -->
      <ellipse cx="22" cy="36" rx="2.2" ry="2.6" fill="#1e1810" />
      <circle cx="22.8" cy="35.3" r="0.9" fill="#ffffff" />
      <circle cx="21.2" cy="37" r="0.45" fill="#ffffff" />

      <!-- Pink Blush -->
      <ellipse cx="18.5" cy="41" rx="2.5" ry="1.6" fill="#fb7185" opacity="0.85" />
    </g>

    <!-- ================= 3. LOVE HEART & SPARKLE (Completely Above) ================= -->
    <!-- Floating in top-center with 0 overlap on any animal -->
    <g transform="translate(32, 14)" filter="url(#heartShadow)">
      <path
        d="M 0 3.5 C 0 0.8 -3.5 -1.5 -6 0.8 C -8.8 3 -7 7.5 0 12 C 7 7.5 8.8 3 6 0.8 C 3.5 -1.5 0 0.8 0 3.5 Z"
        fill="url(#heartGrad)"
        stroke="#991b1b"
        stroke-width="1.2"
      />
      <!-- Heart shine -->
      <ellipse cx="-3" cy="2.2" rx="1.5" ry="0.8" fill="#ffffff" opacity="0.65" transform="rotate(-30 -3 2.2)" />
    </g>

    <!-- Little Sparkle -->
    <path d="M 17 8 L 17.8 9.8 L 19.8 10.5 L 17.8 11.2 L 17 13 L 16.2 11.2 L 14.2 10.5 L 16.2 9.8 Z" fill="#eab308" stroke="#ca8a04" stroke-width="0.8" />
  </g>

  <!-- CRISP TOP-LEVEL PERIMETER BORDER (NOTHING CAN OVERLAP THIS) -->
  <rect class="border-stroke" x="2" y="2" width="60" height="60" rx="16" fill="none" stroke-width="2.5" />
</svg>
